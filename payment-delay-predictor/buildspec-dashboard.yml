version: 0.2

env:
  variables:
    AWS_REGION: ap-southeast-2
    ECR_REPOSITORY: construction-payment-risk-dashboard-dev
    PROJECT_DIR: payment-delay-predictor

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY
      - COMMIT_SHA=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)
      - IMAGE_TAG="dashboard-$COMMIT_SHA"
      - echo "Source commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "Building image $ECR_URI:$IMAGE_TAG"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI

  build:
    commands:
      - echo "Building dashboard Docker image..."
      - docker build --pull -f "$PROJECT_DIR/Dockerfile.dashboard" -t "$ECR_REPOSITORY:$IMAGE_TAG" "$PROJECT_DIR"
      - docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_URI:$IMAGE_TAG"

  post_build:
    commands:
      - echo "Pushing dashboard image..."
      - docker push "$ECR_URI:$IMAGE_TAG"
      - printf '{"ImageURI":"%s"}' "$ECR_URI:$IMAGE_TAG" > imageDetail.json
      - cat imageDetail.json

artifacts:
  files:
    - imageDetail.json
