version: 0.2

env:
  variables:
    REGION: ap-southeast-2
    REPOSITORY: construction-payment-risk-api-dev
    PROJECT_DIR: payment-delay-predictor

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPOSITORY
      - COMMIT_SHA=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)
      - IMAGE_TAG="api-$COMMIT_SHA"
      - echo "Source commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "Building image $ECR_URI:$IMAGE_TAG"
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URI

  build:
    commands:
      - echo "Build started on $(date)"
      - cd "$PROJECT_DIR"
      - docker build --pull -t "$REPOSITORY:$IMAGE_TAG" .
      - docker tag "$REPOSITORY:$IMAGE_TAG" "$ECR_URI:$IMAGE_TAG"

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Pushing $ECR_URI:$IMAGE_TAG"
      - docker push "$ECR_URI:$IMAGE_TAG"
      - printf '{"imageUri":"%s"}' "$ECR_URI:$IMAGE_TAG" > imageDetail.json
      - cat imageDetail.json

artifacts:
  files:
    - payment-delay-predictor/imageDetail.json