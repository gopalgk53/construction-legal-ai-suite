name: Payment Risk CI

on:
  push:
    paths:
      - "payment-delay-predictor/**"
      - ".github/workflows/payment-risk-ci.yml"

  pull_request:
    paths:
      - "payment-delay-predictor/**"
      - ".github/workflows/payment-risk-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payment-delay-predictor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            payment-delay-predictor/requirements-api.txt
            payment-delay-predictor/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -r requirements-test.txt

      - name: Compile application
        run: |
          python -m compileall -q app tests

      - name: Import application
        run: |
          python -c "import app.main; print('Application import passed')"

      - name: Run CI-safe contract tests
        run: |
          python -m pytest tests/test_api_contract.py -q
