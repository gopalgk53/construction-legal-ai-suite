name: Deploy WO Intelligence Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wo-agent-orchestrator/frontend/**"
      - ".github/workflows/deploy-wo-intelligence-web.yml"

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-gopalg53-2640
  CONTAINER_APP_ENVIRONMENT: wo-intelligence-env
  CONTAINER_APP_NAME: wo-intelligence-web

  ACR_NAME: gopalg53woacr
  ACR_LOGIN_SERVER: gopalg53woacr-aqdvdqgtfce0ate0.azurecr.io
  IMAGE_NAME: wo-intelligence-web

  NEXT_PUBLIC_WO_API_BASE_URL: https://wo-intelligence-api.victoriousmoss-788bd572.southeastasia.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${ACR_NAME}"

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_WO_API_BASE_URL="${NEXT_PUBLIC_WO_API_BASE_URL}" \
            -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            wo-agent-orchestrator/frontend

      - name: Push frontend image
        run: docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Check whether Container App exists
        id: app
        run: |
          if az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create frontend Container App
        if: steps.app.outputs.exists == 'false'
        run: |
          az containerapp create \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --environment "${CONTAINER_APP_ENVIRONMENT}" \
            --image "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --registry-server "${ACR_LOGIN_SERVER}" \
            --registry-identity system \
            --system-assigned \
            --ingress external \
            --target-port 3000 \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 0.5 \
            --memory 1Gi

      - name: Update frontend Container App
        if: steps.app.outputs.exists == 'true'
        run: |
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Show deployment
        run: |
          az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "{fqdn:properties.configuration.ingress.fqdn,revision:properties.latestRevisionName}" \
            --output table
